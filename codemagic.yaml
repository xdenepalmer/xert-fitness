workflows:
  ios-verify:
    name: XERT iOS Verify
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      xcode: latest
      cocoapods: default
      node: 22
      groups:
        # Shared team signing key group.
        - appstore
        # XERT-specific Supabase/Vercel runtime values.
        - xert_env
      vars:
        BUNDLE_ID: com.xertfitness.app
        IOS_DIRECTORY: ios/XertFitnessApp
        XCODE_PROJECT: XertFitness.xcodeproj
        XCODE_SCHEME: XertFitness
    scripts:
      - name: Write XERT runtime configuration
        script: |
          set -e
          # Verification only compiles and runs unit tests, so live service values
          # are optional here. Release builds below remain strict.
          SUPABASE_URL_VALUE="${SUPABASE_URL:-https://placeholder.supabase.co}"
          SUPABASE_ANON_KEY_VALUE="${SUPABASE_ANON_KEY:-placeholder-anon-key}"
          VERCEL_BASE_URL_VALUE="${VERCEL_BASE_URL:-https://example.com}"

          escape_xcconfig_url() {
            printf '%s' "$1" | sed 's#//#/$()/#'
          }

          cat > "$CM_BUILD_DIR/$IOS_DIRECTORY/Config.xcconfig" <<EOF
          SUPABASE_URL = $(escape_xcconfig_url "$SUPABASE_URL_VALUE")
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY_VALUE
          VERCEL_BASE_URL = $(escape_xcconfig_url "$VERCEL_BASE_URL_VALUE")
          EOF
      - name: Install XcodeGen when needed
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          xcodegen generate
      - name: Run Swift unit tests
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/run-swift-tests.sh
    artifacts:
      - ios/XertFitnessApp/build/test-results.xcresult
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: XERT iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Shared-team App Store Connect API key integration.
      app_store_connect: codemagic
    environment:
      groups:
        # Contains the stable distribution certificate private key.
        - appstore
        # Contains XERT-specific Supabase/Vercel runtime values.
        - xert_env
      xcode: latest
      cocoapods: default
      node: 22
      vars:
        BUNDLE_ID: com.xertfitness.app
        IOS_DIRECTORY: ios/XertFitnessApp
        XCODE_PROJECT: XertFitness.xcodeproj
        XCODE_SCHEME: XertFitness
    scripts:
      - name: Write XERT runtime configuration
        script: |
          set -e
          : "${SUPABASE_URL:?Add SUPABASE_URL as a Codemagic application environment variable.}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY as a Codemagic application environment variable.}"
          : "${VERCEL_BASE_URL:?Add VERCEL_BASE_URL as a Codemagic application environment variable.}"

          escape_xcconfig_url() {
            printf '%s' "$1" | sed 's#//#/$()/#'
          }

          cat > "$CM_BUILD_DIR/$IOS_DIRECTORY/Config.xcconfig" <<EOF
          SUPABASE_URL = $(escape_xcconfig_url "$SUPABASE_URL")
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          VERCEL_BASE_URL = $(escape_xcconfig_url "$VERCEL_BASE_URL")
          EOF
      - name: Verify production service contract
        script: |
          set -e
          # These are public URLs, so on failure we can safely dump the first bytes
          # to expose the exact malformation (missing scheme, quotes, whitespace, http://).
          url_diag() {
            printf '::error:: %s must use HTTPS. Got length=%s, first bytes:\n' "$1" "${#2}"
            printf '%s' "$2" | head -c 32 | od -An -c
            echo "Fix the value in the Codemagic 'xert_env' variable group: it must start with https:// (no quotes, no spaces)."
            exit 1
          }
          case "$SUPABASE_URL" in https://*) ;; *) url_diag SUPABASE_URL "$SUPABASE_URL" ;; esac
          case "$VERCEL_BASE_URL" in https://*) ;; *) url_diag VERCEL_BASE_URL "$VERCEL_BASE_URL" ;; esac

          # Values pasted into Codemagic sometimes carry stray line breaks or spaces;
          # those become malformed HTTP requests (opaque 400s), so name the exact
          # offender before any network call. Never prints the value itself.
          ws_guard() {
            case "$2" in
              *$'\n'*|*$'\r'*) echo "::error:: $1 contains a line break - delete it in the xert_env group and re-add it as ONE line."; exit 1 ;;
              *' '*) echo "::error:: $1 contains a space - delete it in the xert_env group and re-add it without spaces."; exit 1 ;;
            esac
          }
          ws_guard SUPABASE_URL "$SUPABASE_URL"
          ws_guard VERCEL_BASE_URL "$VERCEL_BASE_URL"
          ws_guard SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"

          curl --silent --show-error --fail --max-time 20 "$VERCEL_BASE_URL/" >/dev/null
          API_BODY="$(mktemp)"
          API_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$API_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/checkout" \
            -H 'Authorization: Bearer codemagic-preflight-invalid-token' \
            -H 'Content-Type: application/json' \
            --data '{}')" || API_CODE=000
          if [ "$API_CODE" != "401" ]; then
            echo "::error:: Production checkout preflight expected HTTP 401 but received $API_CODE. Response body:"
            head -c 300 "$API_BODY"; echo
            case "$API_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/checkout Vercel Function was not deployed." ;;
              000) echo "The checkout function timed out or could not be reached." ;;
            esac
            rm -f "$API_BODY"
            exit 1
          fi
          rm -f "$API_BODY"

          REFUND_BODY="$(mktemp)"
          REFUND_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$REFUND_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/admin-refund-order" \
            -H 'Content-Type: application/json' \
            --data '{}')" || REFUND_CODE=000
          if [ "$REFUND_CODE" != "401" ]; then
            echo "::error:: Production refund preflight expected HTTP 401 but received $REFUND_CODE. Response body:"
            head -c 300 "$REFUND_BODY"; echo
            case "$REFUND_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/admin-refund-order Vercel Function was not deployed." ;;
              000) echo "The refund function timed out or could not be reached." ;;
            esac
            rm -f "$REFUND_BODY"
            exit 1
          fi
          rm -f "$REFUND_BODY"

          RECONCILE_BODY="$(mktemp)"
          RECONCILE_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$RECONCILE_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/admin-reconcile-order" \
            -H 'Content-Type: application/json' \
            --data '{}')" || RECONCILE_CODE=000
          if [ "$RECONCILE_CODE" != "401" ]; then
            echo "::error:: Production reconciliation preflight expected HTTP 401 but received $RECONCILE_CODE. Response body:"
            head -c 300 "$RECONCILE_BODY"; echo
            case "$RECONCILE_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/admin-reconcile-order Vercel Function was not deployed." ;;
              000) echo "The reconciliation function timed out or could not be reached." ;;
            esac
            rm -f "$RECONCILE_BODY"
            exit 1
          fi
          rm -f "$RECONCILE_BODY"

          WEBHOOK_BODY="$(mktemp)"
          WEBHOOK_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$WEBHOOK_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/stripe-webhook" \
            -H 'Stripe-Signature: t=0,v1=codemagic-preflight-invalid-signature' \
            -H 'Content-Type: application/json' \
            --data '{}')" || WEBHOOK_CODE=000
          if [ "$WEBHOOK_CODE" != "400" ]; then
            echo "::error:: Production Stripe webhook preflight expected HTTP 400 but received $WEBHOOK_CODE. Response body:"
            head -c 300 "$WEBHOOK_BODY"; echo
            case "$WEBHOOK_CODE" in
              500) echo "Add STRIPE_WEBHOOK_SECRET and the other server secrets to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/stripe-webhook Vercel Function was not deployed." ;;
              000) echo "The Stripe webhook function timed out or could not be reached." ;;
            esac
            rm -f "$WEBHOOK_BODY"
            exit 1
          fi
          rm -f "$WEBHOOK_BODY"

          CAP_BODY="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$CAP_BODY" -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/rpc/xert_public_capabilities" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')" || HTTP_CODE=000
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error:: Capability RPC failed with HTTP $HTTP_CODE. Response body:"
            head -c 300 "$CAP_BODY"; echo
            case "$HTTP_CODE" in
              404) echo "xert_public_capabilities is missing - run the required upgrade SQL files listed in src/lib/schemaCapabilities.js." ;;
              401|403) echo "The anon key was rejected - re-check SUPABASE_ANON_KEY in the xert_env group." ;;
              400) echo "Malformed request - SUPABASE_URL or SUPABASE_ANON_KEY contains stray characters." ;;
              000) echo "No HTTP response - SUPABASE_URL may be unreachable." ;;
            esac
            rm -f "$CAP_BODY"
            exit 1
          fi
          CAPABILITIES="$(cat "$CAP_BODY")"
          rm -f "$CAP_BODY"
          node -e '
            const rows = JSON.parse(process.argv[1]);
            const installed = new Set(rows.map(row => row.capability));
            const required = [
              "admin_role_safety",
              "audited_credit_grants",
              "booking_waitlist_withdrawal",
              "member_waitlist_join",
              "waitlist_fifo_promotion",
              "attendance_roll_call",
              "class_session_update_guard",
              "product_update_guard",
              "stripe_refund_reconciliation",
              "checkout_reconciliation",
              "member_announcements",
              "announcement_receipts",
              "announcement_actions",
              "booking_time_conflict_guard",
              "admin_member_notes",
              "schedule_blackout_guard",
              "database_security_hardening",
              "credit_expiry_follow_up",
              "member_pt_request_tracking",
              "public_form_integrity",
            ];
            const missing = required.filter(item => !installed.has(item));
            if (missing.length) {
              console.error(`::error:: Missing production database capabilities: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log("Production service contract verified.");
          ' "$CAPABILITIES"
      - name: Install XcodeGen when needed
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          xcodegen generate
      - name: Run Swift unit tests
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/run-swift-tests.sh
      - name: Set up code signing (reuse the shared distribution certificate)
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          keychain initialize
          SIGNING_KEY="${CERTIFICATE_PRIVATE_KEY:-${CERT_PRIVATE_KEY:-$IOS_DISTRIBUTION_PRIVATE_KEY}}"
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error:: No signing key set - add CERTIFICATE_PRIVATE_KEY as a Secure var in group 'appstore'."
            exit 1
          fi
          CERT_KEY="$(mktemp)"
          trap 'rm -f "$CERT_KEY"' EXIT
          printf '%s' "$SIGNING_KEY" > "$CERT_KEY"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Stamp incrementing build number
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          agvtool new-version -all "$(date +%s)"
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed release bundle (release truth)
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error:: no IPA under build/ios/ipa"
            exit 1
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          unzip -q "$IPA_PATH" -d "$WORK"
          APP_PATH="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error:: no .app inside IPA Payload"
            exit 1
          fi

          codesign -d --entitlements :- "$APP_PATH" > "$WORK/entitlements.plist"
          cat "$WORK/entitlements.plist"
          grep -q "aps-environment" "$WORK/entitlements.plist" || {
            echo "::error:: Missing aps-environment entitlement!"
            exit 1
          }
          grep -q "application-identifier" "$WORK/entitlements.plist" || {
            echo "::error:: Missing application-identifier entitlement!"
            exit 1
          }

          PRIVACY_MANIFEST="$APP_PATH/PrivacyInfo.xcprivacy"
          if [ ! -f "$PRIVACY_MANIFEST" ]; then
            echo "::error:: PrivacyInfo.xcprivacy is missing from the signed app bundle!"
            exit 1
          fi
          plutil -lint "$PRIVACY_MANIFEST"
          PRIVACY_XML="$(plutil -convert xml1 -o - "$PRIVACY_MANIFEST")"
          printf '%s' "$PRIVACY_XML" | grep -q "NSPrivacyAccessedAPICategoryUserDefaults" || {
            echo "::error:: Privacy manifest does not declare UserDefaults usage!"
            exit 1
          }
          printf '%s' "$PRIVACY_XML" | grep -q "CA92.1" || {
            echo "::error:: Privacy manifest is missing the app-local UserDefaults reason!"
            exit 1
          }
          printf '%s' "$PRIVACY_XML" | grep -q "NSPrivacyCollectedDataTypeEmailAddress" || {
            echo "::error:: Privacy manifest is missing XERT account data declarations!"
            exit 1
          }
          echo "Signed bundle verified: entitlements and privacy manifest present."
    artifacts:
      - ios/XertFitnessApp/build/test-results.xcresult
      - ios/XertFitnessApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
